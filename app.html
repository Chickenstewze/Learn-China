<title>Hanzi Steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Lexend:wght@300;400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one reading column like a practice notebook; units run down a numbered path, tone colours run through every word. */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --sunk: #E6ECE8;
  --ink: #17201C;
  --muted: #5A6A63;
  --line: #D5DED9;
  --accent: #1E6A57;
  --accent-ink: #FFFFFF;
  --seal: #B8322A;
  --good: #2C7A4B;
  --good-bg: #E1F2E7;
  --bad: #B83A30;
  --bad-bg: #F8E3E0;
  --t1: #C8362B; --t2: #BF730C; --t3: #2E7D47; --t4: #2C5FAD; --t5: #7A847F;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-han: "Noto Serif SC", "Songti SC", "SimSun", "PingFang SC", "Microsoft YaHei", serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #1A211E; --sunk: #232C28; --ink: #E6EDE9; --muted: #98A79F; --line: #2D3833;
    --accent: #5FC2A5; --accent-ink: #0D1A15; --seal: #D9534A;
    --good: #6FCF97; --good-bg: #1B3326; --bad: #F08A80; --bad-bg: #3A1F1C;
    --t1: #F2796D; --t2: #F0B455; --t3: #6CC488; --t4: #82AAEE; --t5: #9AA6A0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1A211E; --sunk: #232C28; --ink: #E6EDE9; --muted: #98A79F; --line: #2D3833;
  --accent: #5FC2A5; --accent-ink: #0D1A15; --seal: #D9534A;
  --good: #6FCF97; --good-bg: #1B3326; --bad: #F08A80; --bad-bg: #3A1F1C;
  --t1: #F2796D; --t2: #F0B455; --t3: #6CC488; --t4: #82AAEE; --t5: #9AA6A0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55; font-weight: 400;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.6rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.han { font-family: var(--f-han); font-weight: 500; }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.seal {
  width: 44px; height: 44px; border-radius: 8px; background: var(--seal); color: #FFF;
  display: grid; place-items: center; font-family: var(--f-han); font-weight: 700; font-size: 26px;
  transform: rotate(-4deg);
}
.brand h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: 0.8rem; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 0.85rem; color: var(--muted);
}
.chip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

nav.tabs { display: flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 12px; }
nav.tabs button svg { display: none; width: 22px; height: 22px; }
button, [data-act] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
nav.tabs button {
  flex: 1; border: 0; background: transparent; padding: 10px 8px; border-radius: 9px;
  font-weight: 500; color: var(--muted); font-size: 0.95rem;
}
nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 10px; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 14px 24px; font-size: 1.05rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.speak {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; flex: none;
}
.speak:hover { border-color: var(--accent); color: var(--accent); }
.speak svg { width: 20px; height: 20px; }
.speak.lg { width: 64px; height: 64px; }
.speak.lg svg { width: 28px; height: 28px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* path */
.hero-next {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 22px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.hero-next .bigzh { font-family: var(--f-han); font-size: 3.2rem; line-height: 1; font-weight: 700; color: var(--accent); }
.hero-next .txt { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 0.75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; position: relative; }
.path::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 2px; background: var(--line); }
.unit {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 16px; align-items: center;
  padding: 12px 0; position: relative;
}
.unit .num {
  width: 44px; height: 44px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line);
  display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); z-index: 1;
}
.unit.done .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.unit.next .num { border-color: var(--accent); color: var(--accent); }
.unit .info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.unit .info .t { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.unit .info .zh { font-family: var(--f-han); font-size: 1.25rem; font-weight: 700; }
.unit .info .en { font-weight: 500; }
.unit .info .meta { color: var(--muted); font-size: 0.85rem; }
.stars { color: var(--t2); letter-spacing: 2px; font-size: 0.9rem; }
.stars .off { color: var(--line); }

/* lesson */
.lessonbar { display: flex; align-items: center; gap: 12px; }
.progress { flex: 1; height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 28px 24px; display: flex; flex-direction: column; gap: 18px;
}
.word { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding-block: 8px; }
.word .hz { font-family: var(--f-han); font-weight: 500; font-size: clamp(3.2rem, 14vw, 5.5rem); line-height: 1.1; word-break: keep-all; }
.word .hz.sentence { font-size: clamp(2rem, 8vw, 3rem); }
.word .py { font-size: 1.5rem; font-weight: 500; letter-spacing: .01em; }
.word .en { font-size: 1.15rem; color: var(--muted); }
.note { background: var(--sunk); border-radius: 10px; padding: 12px 14px; font-size: 0.93rem; color: var(--ink); }
.note .han { font-size: 1.05em; }
.intro { display: flex; flex-direction: column; gap: 14px; max-width: 62ch; }
.intro p { color: var(--ink); }

.prompt { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.prompt .ask { color: var(--muted); font-size: 0.95rem; }
.prompt .q-en { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-height: 64px; justify-content: center;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-size: 0.7rem; color: var(--muted); align-self: flex-start; margin-bottom: -10px; }
.opt .oh { font-family: var(--f-han); font-size: 1.7rem; line-height: 1.2; }
.opt .op { font-size: 0.85rem; color: var(--muted); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.opt svg { width: 56px; height: 34px; }
.feedback { border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.feedback.ok { background: var(--good-bg); color: var(--good); }
.feedback.no { background: var(--bad-bg); color: var(--bad); }
.feedback .msg { flex: 1; min-width: 180px; }
.feedback .msg b { display: block; }
.feedback .msg span { color: var(--ink); }

/* tone chart */
.chart { width: 100%; max-width: 520px; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 9px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.tonegrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tonecell {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tonecell:hover { border-color: var(--accent); }
.tonecell .oh { font-family: var(--f-han); font-size: 1.6rem; }
.tonecell .op { font-weight: 600; }
.tonecell small { color: var(--muted); font-size: 0.75rem; text-align: center; }

.score { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.score .pct { font-family: var(--f-display); font-size: 3.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.score .stars { font-size: 2rem; letter-spacing: 6px; }

/* review */
.flash { cursor: pointer; min-height: 260px; justify-content: center; }
.seg { display: inline-flex; background: var(--sunk); padding: 3px; border-radius: 10px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.box b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.box small { color: var(--muted); font-size: 0.72rem; }

/* words */
.search {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font: inherit;
}
.wordlist { display: flex; flex-direction: column; gap: 22px; }
.group h3 { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
.group h3 .han { font-size: 1rem; color: var(--muted); }
.wl { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.wl li { display: grid; grid-template-columns: minmax(84px, auto) 1fr 44px; gap: 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.wl li:first-child { border-top: 0; }
.wl .h { font-family: var(--f-han); font-size: 1.45rem; }
.wl .m { min-width: 0; display: flex; flex-direction: column; }
.wl .m span:last-child { color: var(--muted); font-size: 0.9rem; }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; display: flex; flex-direction: column; gap: 14px; align-items: center; }

footer.note-voice { font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* coach */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.mode { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.mode p { color: var(--muted); font-size: 0.92rem; }
.mode .spacer { flex: 1; }
.field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 0.95rem; resize: vertical; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; color: var(--muted); }
.sugg button:hover { border-color: var(--accent); color: var(--accent); }
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.thinking { color: var(--muted); font-style: italic; }
.hanbtn { border: 0; background: none; padding: 0; font-family: var(--f-han); font-size: 1.08em; color: inherit; text-decoration: underline dotted var(--accent); text-underline-offset: 4px; }
.hanbtn:hover { color: var(--accent); }
details.brief { font-size: 0.85rem; color: var(--muted); }
details.brief pre { white-space: pre-wrap; font-family: inherit; background: var(--sunk); padding: 10px 12px; border-radius: 10px; margin: 8px 0 0; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; }
.err { color: var(--bad); font-size: 0.92rem; }
pre.prompt-copy { white-space: pre-wrap; font-family: inherit; background: var(--sunk); padding: 14px; border-radius: 10px; margin: 0; font-size: 0.92rem; max-height: 50vh; overflow: auto; }

@media (max-width: 640px) {
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-radius: 0; gap: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
  }
  nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem !important; padding: 6px 2px !important; }
  nav.tabs button svg { display: block; }
  nav.tabs button[aria-current="page"] { box-shadow: none; color: var(--accent); background: transparent; }
}
@media (max-width: 480px) {
  .options { grid-template-columns: 1fr; }
  .options.tones { grid-template-columns: 1fr 1fr; }
  .card { padding: 22px 16px; }
  .tonegrid { grid-template-columns: 1fr 1fr; }
  nav.tabs button { font-size: 0.88rem; padding: 9px 4px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: none; opacity: 1; } }
.pop { animation: pop .18s ease-out; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">学</div>
      <div><h1>Hanzi Steps</h1><small>Mandarin from zero</small></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-act="tab" data-tab="path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg><span class="lbl">Lessons</span></button>
    <button data-act="tab" data-tab="tones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17c3 0 3-10 6-10s3 10 6 10 3-6 6-6"/></svg><span class="lbl">Tones</span></button>
    <button data-act="tab" data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span class="lbl">Review</span></button>
    <button data-act="tab" data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span class="lbl">Coach</span></button>
    <button data-act="tab" data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="lbl">Words</span></button>
  </nav>

  <footer class="note-voice" id="voice-note"></footer>
</div>

<script>
// ---------- data ----------
const W = (h, p, e, n) => ({ h, p, e, n });
const UNITS = [
  { id: 'tones', zh: '声调', title: 'The four tones', intro: 'tones', words: [
    W('妈', 'mā', 'mom', 'Tone 1: high and level, like singing one steady note.'),
    W('麻', 'má', 'numb', 'Tone 2: rises, like asking "huh?"'),
    W('马', 'mǎ', 'horse', 'Tone 3: dips low, then comes back up a little.'),
    W('骂', 'mà', 'to scold', 'Tone 4: falls sharply, like a firm "No!"'),
    W('吗', 'ma', 'yes/no question word', 'Neutral tone: short and light. No mark over the vowel.'),
  ]},
  { id: 'greet', zh: '问候', title: 'Greetings', intro: 'Pinyin is the Latin spelling of Chinese sounds, and the mark over the vowel tells you the tone. Here is your first rule: when two 3rd tones meet, the first one is said as a 2nd tone. So <span class="han">你好</span> nǐ hǎo comes out as "ní hǎo".', words: [
    W('你好', 'nǐ hǎo', 'hello', 'Literally "you good". Said "ní hǎo" because of the 3rd-tone rule.'),
    W('谢谢', 'xiè xie', 'thank you', 'x sounds like a soft "sh" with your tongue behind your bottom teeth.'),
    W('不客气', 'bú kè qi', "you're welcome", 'Literally "don\'t be polite".'),
    W('再见', 'zài jiàn', 'goodbye', 'Literally "again see".'),
    W('对不起', 'duì bu qǐ', 'sorry'),
    W('没关系', 'méi guān xi', "it's okay / no problem", 'The usual reply to 对不起.'),
    W('请', 'qǐng', 'please', 'q sounds like "ch" in "cheese".'),
    W('早上好', 'zǎo shang hǎo', 'good morning'),
    W('晚安', 'wǎn ān', 'good night'),
  ]},
  { id: 'num', zh: '数字', title: 'Numbers', intro: 'Chinese numbers build like blocks. <span class="han">十一</span> is "ten one" = 11. <span class="han">二十</span> is "two ten" = 20. <span class="han">九十九</span> is "nine ten nine" = 99. Learn 1 to 10 and you can count to 99.', words: [
    W('一', 'yī', 'one (1)', 'One stroke for one.'),
    W('二', 'èr', 'two (2)', 'Two strokes for two.'),
    W('三', 'sān', 'three (3)', 'Three strokes for three.'),
    W('四', 'sì', 'four (4)', 'Sounds close to 死 sǐ (death), so 4 is an unlucky number.'),
    W('五', 'wǔ', 'five (5)'),
    W('六', 'liù', 'six (6)'),
    W('七', 'qī', 'seven (7)'),
    W('八', 'bā', 'eight (8)', 'Sounds like 发 fā (to get rich), so 8 is the lucky number.'),
    W('九', 'jiǔ', 'nine (9)'),
    W('十', 'shí', 'ten (10)'),
    W('二十', 'èr shí', 'twenty (20)', '"Two tens".'),
    W('零', 'líng', 'zero (0)'),

const MARKS = { 1: 'āēīōūǖĀĒĪŌŪǕ', 2: 'áéíóúǘÁÉÍÓÚǗ', 3: 'ǎěǐǒǔǚǍĚǏǑǓǙ', 4: 'àèìòùǜÀÈÌÒÙǛ' };

const SYNCED = ['progress', 'deck', 'streak'];
const store = {
  get(k, d) { try { const v = localStorage.getItem('hzs:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hzs:' + k, JSON.stringify(v)); } catch {} if (SYNCED.includes(k)) queueCloud(); },
};

const dayKey = d => d.toISOString().slice(0, 10);
function markActivity() {
  const today = dayKey(new Date()), yest = dayKey(new Date(Date.now() - DAY));
  if (streak.last === today) return;
  streak = { days: streak.last === yest ? streak.days + 1 : 1, last: today };
  store.set('streak', streak);
}
function currentStreak() {
  const today = dayKey(new Date()), yest = dayKey(new Date(Date.now() - DAY));
  return (streak.last === today || streak.last === yest) ? streak.days : 0;

// ---------- cross-device sync (Claude account, private per person) ----------
let cloudRef = null, cloudTimer = null, cloudSaving = false, cloudAgain = false;
function mergeState(r) {
  let changed = false;
  for (const [k, v] of Object.entries(r.progress || {})) if (typeof v === 'number' && !(progress[k] >= v)) { progress[k] = v; changed = true; }
  for (const [h, c] of Object.entries(r.deck || {})) {
    const mine = deck[h];
    if (c && (!mine || (c.t || 0) > (mine.t || 0))) { deck[h] = { box: c.box, due: c.due, t: c.t || 0 }; changed = true; }
  }
  const rs = r.streak;
  if (rs && rs.last && (!streak.last || rs.last > streak.last || (rs.last === streak.last && rs.days > streak.days))) { streak = { days: rs.days, last: rs.last }; changed = true; }
  if (changed) { try { for (const k of SYNCED) localStorage.setItem('hzs:' + k, JSON.stringify({ progress, deck, streak }[k])); } catch {} }
  return changed;
}
function queueCloud() { if (!cloudRef) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(saveCloud, 1200); }
async function saveCloud() {
  if (!cloudRef) return;
  if (cloudSaving) { cloudAgain = true; return; }
  cloudSaving = true;
  try { await cloudRef.set({ progress, deck, streak, v: 1 }); } catch {}
  cloudSaving = false;
  if (cloudAgain) { cloudAgain = false; saveCloud(); }
}
async function initCloud() {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]).catch(() => [null, null]);
  if (!db || !user) return;
  const id = await user.id().catch(() => null);
  if (!id) return;
  const ref = db.doc('data/users/' + id + '/state');
  let first = true;
  ref.onSnapshot(snap => {
    const r = snap.exists ? snap.data() : {};
    const changed = mergeState(r);
    if (first) {
      first = false; cloudRef = ref; renderVoiceNote();
      const remoteN = Object.keys(r.deck || {}).length + Object.keys(r.progress || {}).length;
      if (!snap.exists || Object.keys(deck).length + Object.keys(progress).length > remoteN) queueCloud();
    }
    if (changed) { renderStats(); if (view === 'path' || view === 'words' || (view === 'review' && !R.shown)) render(); }
  }, () => { cloudRef = null; renderVoiceNote(); });
}

function makeQ(type, w, unit) {
  if (type === 'tone' || type === 'toneRead') return { type, w, opts: [1, 2, 3, 4], ans: toneOf(w.p) };
  const poolSrc = unit.words.length >= 4 ? unit.words : ALL;
  let pool = poolSrc.filter(x => x !== w && x.e !== w.e && stripTones(x.p) !== stripTones(w.p));
  shuffle(pool);
  let opts = pool.slice(0, 3);
  if (opts.length < 3) opts = opts.concat(shuffle(ALL.filter(x => x !== w && !opts.includes(x) && stripTones(x.p) !== stripTones(w.p))).slice(0, 3 - opts.length));
  opts = shuffle(opts.concat([w]));
  return { type, w, opts, ans: w };
}
function buildQuiz(unit) {
  const words = unit.words, n = Math.min(8, Math.max(6, words.length));
  const pool = shuffle(words.slice()), qs = [];
  for (let k = 0; k < n; k++) {
    const w = pool[k % pool.length];
    let types = ['h2e', 'e2h'];
    if (canListen()) types.push('listen', 'listen');
    if (unit.id === 'tones') types = toneOf(w.p) === 5 ? ['h2e', 'e2h'] : (canListen() ? ['tone', 'tone', 'h2e'] : ['toneRead', 'h2e']);
    qs.push(makeQ(pick(types), w, unit));
  }
  return qs;
}

      <div class="row" style="justify-content:center"><span style="font-size:1.2rem">${colorPy(w.p)}</span>${hasTTS ? `<button class="speak" data-act="say" data-text="${w.h}" aria-label="Play audio">${ICON_SPEAK}</button>` : ''}</div>`;
    case 'e2h': return `<span class="ask">How do you say this in Chinese?</span><div class="q-en">${w.e}</div>`;
    case 'listen': return `<span class="ask">Listen. Which one did you hear?</span>

function quizHtml(q) {
  const tones = q.type === 'tone' || q.type === 'toneRead';
  let fb = '';
  if (q.picked != null) {
    const ok = q.picked === q.ans, w = q.w;
    fb = `<div class="feedback ${ok ? 'ok' : 'no'}" role="status">
      <div class="msg"><b>${ok ? pick(['Correct!', 'Nice!', 'Right!', '对! Correct.']) : 'Not quite.'}</b>

function doneHtml() {
  const s = L.firstRight / L.n, st = starsFor(s), pass = s >= 0.6;
  const ni = UNITS.indexOf(L.unit) + 1;
  return `<section class="card score pop">
    <span class="eyebrow">Lesson ${ni} complete</span>

      <button class="btn" data-act="start" data-unit="${ni - 1}">Do it again</button>
      ${pass && ni < UNITS.length ? `<button class="btn primary big" data-act="start" data-unit="${ni}">Next: ${UNITS[ni].title}</button>` : `<button class="btn primary big" data-act="tab" data-tab="path">Back to lessons</button>`}
    </div>
  </section>`;
}
function answer(k) {
  const q = L.qs[L.qi];
  if (q.picked != null) return;
  q.picked = q.opts[k];
  const ok = q.picked === q.ans;
  if (!q.retry && ok) L.firstRight++;
  if (!ok && !q.retry) L.qs.push(Object.assign(makeQ(q.type, q.w, L.unit), { retry: true }));
  if (q.type === 'h2e' || q.type === 'e2h') speak(q.w.h);
  renderLesson();
}
function cont() {
  L.qi++;
  if (L.qi >= L.qs.length) finishLesson();
  renderLesson();
  autoPlay();
}
function autoPlay() {
  if (view !== 'lesson' || L.phase !== 'quiz') return;
  const q = L.qs[L.qi];
  if (q && (q.type === 'listen' || q.type === 'tone')) setTimeout(() => speak(q.w.h), 250);
}
function finishLesson() {
  L.phase = 'done';
  const s = L.firstRight / L.n;
  progress[L.unit.id] = Math.max(progress[L.unit.id] ?? 0, s);
  store.set('progress', progress);
  if (s >= 0.6) {
    const now = Date.now();
    L.unit.words.forEach(w => { if (!deck[w.h]) deck[w.h] = { box: 1, due: now, t: now }; });
    store.set('deck', deck);
  }
  markActivity();
  renderStats();
}

// ---------- tone trainer ----------
function newToneItem() {
  let it; do { it = pick(TONE_SET); } while (T.item && it[0] === T.item[0]);
  T.item = it; T.answered = null;
}
function renderTones() {
  if (!T.item) newToneItem();
  const [h, p, e] = T.item, t = toneOf(p), listen = canListen();
  const acc = T.total ? Math.round(T.right / T.total * 100) : null;
  $main.innerHTML = `<div class="wrap" style="gap:18px">
    <div class="row">
      <div><h2>Tone trainer</h2><p style="color:var(--muted)">${listen ? 'Hear a syllable, pick its tone. This is the skill that makes you understood.' : 'Reading mode: no Chinese voice on this device, so you will identify tone marks instead.'}</p></div>
      <span class="spacer"></span>
      <div class="stats"><span class="chip"><b>${T.run}</b> in a row</span><span class="chip"><b>${acc == null ? '–' : acc + '%'}</b> of ${T.total}</span></div>
    </div>
    <section class="card pop">
      <div class="prompt">
        ${listen ? `<span class="ask">Which tone is this?</span><div class="row" style="justify-content:center">${speakBtns(h, true)}</div>`
                 : `<span class="ask">Which tone is marked?</span><div class="q-en" style="font-size:3rem">${p}</div>`}
        ${T.answered != null ? `<div class="row" style="justify-content:center;gap:14px"><span class="han t${t}" style="font-size:2.6rem">${h}</span><span class="t${t}" style="font-size:1.4rem;font-weight:600">${p}</span><span style="color:var(--muted)">${e}</span></div>` : ''}
      </div>
      <div class="options tones" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
        ${[1, 2, 3, 4].map(o => {
          let cls = ''; if (T.answered != null) { if (o === t) cls = 'right'; else if (o === T.answered) cls = 'wrong'; }
          return `<button class="opt ${cls}" data-act="tone" data-t="${o}" ${T.answered != null ? 'disabled' : ''}><span class="k">${o}</span>${contourSvg(o, 56, 34)}<span class="op" style="color:var(--ink);font-weight:600">Tone ${o}</span><span class="op">${TONE_INFO[o].name}</span></button>`;
        }).join('')}
      </div>
      ${T.answered != null ? `<div class="feedback ${T.answered === t ? 'ok' : 'no'}" role="status"><div class="msg"><b>${T.answered === t ? 'Correct!' : `That was tone ${t}, ${TONE_INFO[t].name}.`}</b>${listen && T.answered !== t ? '<span>Play it again and listen for the shape.</span>' : ''}</div><button class="btn primary" data-act="tonenext" autofocus>Next</button></div>` : ''}
    </section>
    <section class="card intro">
      <h3>Cheat sheet</h3>
      ${toneChartHtml()}
      <p style="color:var(--muted);font-size:.93rem">Tone 1 stays high. Tone 2 climbs like a question. Tone 3 dips to the bottom of your voice (in fast speech it often stays low). Tone 4 drops hard. Hum the shape before you say the word.</p>
    </section>
  </div>`;
}
function answerTone(o) {
  if (T.answered != null) return;
  T.answered = o; T.total++;
  if (o === toneOf(T.item[1])) { T.right++; T.run++; } else T.run = 0;
  if (T.total === 1) markActivity();
  render();
}

// ---------- review (spaced repetition) ----------
function nextReviewCard() {
  const due = R.all ? Object.keys(deck).filter(h => BY_H[h]) : dueCards();
  R.card = due.length ? pick(due.filter(h => h !== R.card).length ? due.filter(h => h !== R.card) : due) : null;
  R.shown = false;
}
function renderReview() {
  const total = Object.keys(deck).length;
  if (!total) {
    $main.innerHTML = `<section class="card"><div class="empty">
      <div class="han" style="font-size:3rem;color:var(--accent)">复习</div>
      <h3 style="color:var(--ink)">Your review deck is empty</h3>
      <p style="max-width:42ch">Finish a lesson and its words land here. You will see each one again just before you'd forget it: after 1 day, 3 days, a week, and so on.</p>
      <button class="btn primary big" data-act="start" data-unit="${nextUnitIndex()}">Start lesson ${nextUnitIndex() + 1}</button>
    </div></section>`;
    return;
  }
  if (!R.card || !deck[R.card] || (!R.all && deck[R.card].due > Date.now())) nextReviewCard();
  const boxes = [1, 2, 3, 4, 5].map(b => Object.values(deck).filter(c => c.box === b).length);
  const labels = ['New', '1 day', '3 days', '1 week', 'Mastered'];
  const boxRow = `<div class="boxes">${boxes.map((n, i) => `<div class="box"><b>${n}</b><small>${labels[i]}</small></div>`).join('')}</div>`;
  const head = `<div class="row"><div><h2>Review</h2><p style="color:var(--muted)">${dueCards().length} due now · ${total} words in your deck</p></div><span class="spacer"></span>
    <div class="seg" role="group" aria-label="Card direction">
      <button data-act="dir" data-dir="zh" aria-pressed="${R.dir === 'zh'}">Chinese → English</button>
      <button data-act="dir" data-dir="en" aria-pressed="${R.dir === 'en'}">English → Chinese</button>
    </div></div>`;
  if (!R.card) {
    const nextDue = Math.min(...Object.values(deck).map(c => c.due));
    const hrs = Math.max(1, Math.round((nextDue - Date.now()) / 36e5));
    $main.innerHTML = `<div class="wrap" style="gap:18px">${head}<section class="card"><div class="empty">
      <h3 style="color:var(--ink)">All caught up</h3>
      <p>The next card is due in about ${hrs < 24 ? hrs + ' hour' + (hrs > 1 ? 's' : '') : Math.round(hrs / 24) + ' day' + (hrs >= 48 ? 's' : '')}. You can still practice the whole deck now; it won't change your schedule.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="practiceall">Practice all ${total}</button><button class="btn" data-act="start" data-unit="${nextUnitIndex()}">Next lesson</button></div>
    </div></section>${boxRow}</div>`;
    return;
  }
  const w = BY_H[R.card], sentence = [...w.h].filter(isHan).length > 3;
  const front = R.dir === 'zh'
    ? `<div class="hz ${sentence ? 'sentence' : ''}" lang="zh-CN">${R.shown ? colorHan(w.h, w.p) : w.h}</div>`
    : `<div class="q-en" style="font-family:var(--f-display);font-size:2rem;font-weight:700">${w.e}</div>`;
  const back = R.dir === 'zh'
    ? `<div class="py">${colorPy(w.p)}</div><div class="en">${w.e}</div>`
    : `<div class="hz ${sentence ? 'sentence' : ''}" lang="zh-CN">${colorHan(w.h, w.p)}</div><div class="py">${colorPy(w.p)}</div>`;
  $main.innerHTML = `<div class="wrap" style="gap:18px">${head}
    <section class="card ${R.shown ? '' : 'flash'} pop" ${R.shown ? '' : 'data-act="reveal" tabindex="0" role="button" aria-label="Show answer"'}>
      ${R.all ? '<span class="eyebrow">Practice mode · schedule unchanged</span>' : `<span class="eyebrow">Box ${deck[R.card].box} of 5</span>`}
      <div class="word">${front}${R.shown ? back + `<div class="row" style="justify-content:center">${speakBtns(w.h)}</div>` : '<span style="color:var(--muted)">Say it in your head, then tap to check</span>'}</div>
      ${R.shown ? `<div class="row">
        <button class="btn big" data-act="grade" data-g="0" style="flex:1">Forgot <small style="color:var(--muted)">(1)</small></button>
        <button class="btn primary big" data-act="grade" data-g="1" style="flex:1">Remembered <small>(2)</small></button></div>` : ''}
    </section>
    ${R.all ? '<div class="row"><button class="btn ghost" data-act="stopall">Stop practicing</button></div>' : ''}
    ${boxRow}</div>`;
}
function grade(g) {
  const c = deck[R.card];
  if (!R.all) c.t = Date.now();
  if (!R.all) {
    if (g) { const was = c.box; c.box = Math.min(5, was + 1); c.due = Date.now() + (was === 5 ? INTERVALS[5] : INTERVALS[c.box - 1]); }
    else { c.box = 1; c.due = Date.now() + 10 * 60e3; }
    store.set('deck', deck);
    markActivity();
  }
  nextReviewCard();
  render();
}

// ---------- words ----------
function wordListHtml() {
  const q = stripTones(query.trim());
  const groups = UNITS.map(u => {
    const ws = u.words.filter(w => !q || w.h.includes(query.trim()) || stripTones(w.p).replace(/\s/g, '').includes(q.replace(/\s/g, '')) || w.e.toLowerCase().includes(q));
    return ws.length ? `<section class="group"><h3>${u.title} <span class="han">${u.zh}</span></h3><ul class="wl">${ws.map(w => `
      <li><span class="h" lang="zh-CN">${colorHan(w.h, w.p)}</span><span class="m"><span>${colorPy(w.p)}</span><span>${w.e}</span></span>
      ${hasTTS ? `<button class="speak" data-act="say" data-text="${w.h}" aria-label="Play ${w.e}">${ICON_SPEAK}</button>` : '<span></span>'}</li>`).join('')}</ul></section>` : '';
  }).join('');
  return groups || `<div class="empty">No words match "${query.replace(/[<>&"]/g, '')}". Try English, pinyin without tone marks (ni hao), or characters.</div>`;

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmtAI(t) {

  coachRun();
}
function coachSend(text) { C.turns.push({ role: 'user', content: text }); coachRun(); }
const ERR = {
  rate_limited: 'Claude is busy or you hit your usage limit. Wait a bit, then try again.',
  session_expired: 'Your Claude session expired. Sign in again, then try again.',
  refused: 'Claude declined that message. Try wording it differently.',
  empty_completion: 'Claude sent back an empty answer. Try again or rephrase.',
  prompt_too_large: 'This conversation got too long. Start a new session.',
};
// AI provider: Claude (inside claude.ai) or a local Ollama server (local copy of the app)
let AI = Object.assign({ provider: null, tier: 'quick', url: 'http://localhost:11434', model: '' }, store.get('ai', {}));
let OL = { state: 'idle', models: [], err: '' };   // idle | checking | ok | nomodels | error
const provider = () => AI.provider || 'off';
const noLive = via => via === 'off' || (via === 'claude' && sampleState === 'none');
const HISTORY = 8;   // only the brief + the last few turns are sent, so long chats don't cost more per message
const trimTurns = t => t.length <= HISTORY + 1 ? t : [t[0], ...t.slice(-HISTORY)];
const olBase = () => AI.url.trim().replace(/\/+$/, '');
const stripThink = t => t.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/^\s+/, '');
function olNetErr() {
  return window.claude
    ? 'Pages on claude.ai can\'t reach programs on your computer. Open your downloaded copy of the app to use Ollama.'
    : `Couldn't reach Ollama at ${olBase()}. Check that Ollama is running, and open the app from http://localhost (see "How to set up Ollama").`;
}
async function ollamaCheck() {
  OL = { state: 'checking', models: [], err: '' }; renderCoach();
  try {
    const r = await fetch(olBase() + '/api/tags');
    if (!r.ok) throw new Error(`Ollama answered with error ${r.status}.`);
    const j = await r.json();
    OL.models = (j.models || []).map(m => m.name);
    if (!OL.models.includes(AI.model)) AI.model = OL.models.find(n => /qwen/i.test(n)) || OL.models[0] || '';
    store.set('ai', AI);
    OL.state = OL.models.length ? 'ok' : 'nomodels';
  } catch (e) {
    OL.state = 'error'; OL.err = e instanceof TypeError ? olNetErr() : String(e.message || e);
  }
  if (view === 'coach') renderCoach();
}
async function ollamaChat(turns, signal, onText) {
  if (!AI.model) throw { code: 'ollama', message: 'Pick an Ollama model first: press Connect above the coaches.' };
  let r;
  try {
    r = await fetch(olBase() + '/api/chat', { method: 'POST', signal, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: AI.model, messages: turns, stream: true }) });
  } catch (e) {
    if (e.name === 'AbortError') throw { code: 'cancelled' };
    throw { code: 'ollama', message: olNetErr() };
  }
  if (!r.ok) { let m = ''; try { m = (await r.json()).error; } catch {} throw { code: 'ollama', message: `Ollama error: ${m || r.status}` }; }
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '', raw = '';
  try {
    for (;;) {
      const { value, done } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const j = JSON.parse(line);
        if (j.error) throw { code: 'ollama', message: 'Ollama error: ' + j.error };
        if (j.message?.content) { raw += j.message.content; const t = stripThink(raw); if (t) onText(t); }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') throw { code: 'cancelled', text: stripThink(raw) || undefined };
    throw e;
  }
  const text = stripThink(raw).trim();
  if (!text) throw { code: 'empty_completion' };
  return { text, truncated: false };
}
async function coachRun() {
  if (C.busy) return;
  C.busy = true; C.err = ''; C.retry = false; C.live = '';
  renderCoach();
  const ctl = C.ctl = new AbortController(), mine = C;
  const onText = text => {
    if (C !== mine) return;
    C.live = text; const el = document.getElementById('live');
    if (el) { el.classList.remove('thinking'); el.innerHTML = fmtAI(text); }
  };
  try {
    let res;
    if (C.via === 'ollama') res = await ollamaChat(trimTurns(C.turns), ctl.signal, onText);
    else {
      const s = await sampleP;
      if (!s) throw { code: 'not_granted' };
      res = await s(trimTurns(C.turns), { cache: false, ...(AI.tier === 'opus' ? { model: 'claude-opus-5-5', modelTier: 'complex' } : { modelTier: 'quick' }), signal: ctl.signal, onText: ({ text }) => onText(text) });
    }
    if (C !== mine) return;
    C.turns.push({ role: 'assistant', content: res.text + (res.truncated ? '\n\n(Cut short. Ask me to continue.)' : '') });
    markActivity();
  } catch (e) {
    if (C !== mine) return;
    const code = e?.code || 'upstream_error';
    if (C.via !== 'ollama' && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) sampleState = 'none';
    else if (code === 'cancelled') { if (e.text) C.turns.push({ role: 'assistant', content: e.text + ' …' }); }
    else if (code === 'ollama') { C.err = e.message; C.retry = true; }
    else { C.err = ERR[code] || (C.via === 'ollama' ? 'The connection to Ollama dropped.' : 'The connection to Claude dropped.'); C.retry = true; }
  } finally {
    if (C === mine) { C.busy = false; C.live = ''; C.ctl = null; renderCoach(); }
  }
}
function coachFallbackHtml() {
  return `<section class="card intro">
    <h3>Use this with Claude</h3>
    <p>${C.via === 'off' ? 'The AI tutor is off, so this app uses none of your Claude usage.' : `The coach can't reach Claude from here${window.claude ? ' (Claude access was turned off for this page)' : ' because this copy of the app is running outside claude.ai'}.`} If you want, copy this prompt and paste it into any AI chat yourself. It already includes your progress.</p>
    <pre class="prompt-copy" id="prompt-copy">${esc(C.turns[0].content)}</pre>
    <div class="row"><button class="btn primary" data-act="copyprompt">Copy prompt</button><button class="btn" data-act="coachback">Back</button></div>
  </section>`;
}
function aiBarHtml() {
  const p = provider();
  let body = '';
  if (p === 'off') {
    body = `<p style="color:var(--muted);font-size:.92rem">Off: nothing in this app uses your Claude usage. Each coach gives you a prompt you can copy into a chat yourself. Lessons, tones, review and words never use AI.</p>`;
  } else if (p === 'claude') {
    body = sampleState === 'none'
      ? `<p style="color:var(--muted);font-size:.92rem">Claude isn't reachable from this copy of the app, so each coach gives you a prompt to copy instead.</p>`
      : `<div class="seg" role="group" aria-label="Claude model">
          <button data-act="aitier" data-t="quick" aria-pressed="${AI.tier !== 'opus'}">Fast · light usage</button>
          <button data-act="aitier" data-t="opus" aria-pressed="${AI.tier === 'opus'}">Opus · best, uses more</button>
        </div>
        <p style="color:var(--muted);font-size:.92rem">Claude is only used when you press Start or Send in a coach, and each message counts like a message in a Claude chat. ${AI.tier === 'opus' ? 'Opus gives the best coaching but uses your limits fastest.' : 'Fast uses Claude\'s smallest, quickest model, which uses the least of your limits.'} Only your last few messages are sent each time, so long sessions don't get more expensive.</p>`;
  } else {
    const status = { idle: 'Not connected yet.', checking: 'Connecting…', ok: `Connected. ${OL.models.length} model${OL.models.length > 1 ? 's' : ''} found.`, nomodels: 'Connected, but no models are installed. Run: ollama pull qwen3', error: OL.err }[OL.state];
    body = `<div class="row">
        <input class="field" id="ol-url" style="flex:1;min-width:180px" value="${esc(AI.url)}" aria-label="Ollama address">
        <button class="btn" data-act="olconnect">${OL.state === 'ok' ? 'Reconnect' : 'Connect'}</button>
      </div>
      ${OL.models.length ? `<div class="row"><label class="eyebrow" for="ol-model">Model</label><select class="field" id="ol-model" style="flex:1;min-width:0">${OL.models.map(m => `<option ${m === AI.model ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>` : ''}
      <p class="${OL.state === 'error' ? 'err' : ''}" style="font-size:.9rem;${OL.state === 'error' ? '' : 'color:var(--muted)'}">${esc(status)}</p>
      <details class="brief"><summary>How to set up Ollama</summary><pre>1. Install Ollama from ollama.com and get a model that is good at Chinese:
     ollama pull qwen3
2. Get this app from your GitHub repo (Learn-China). In its folder run:
     python3 -m http.server 8000
   then open http://localhost:8000 in your browser.
3. Go to Coach, choose Ollama and press Connect.

Opening index.html by double-clicking usually gets blocked by Ollama. If you want that anyway, start Ollama with OLLAMA_ORIGINS="*" set.
The claude.ai version of this app can't reach Ollama at all; browsers keep claude.ai pages away from your computer.
Small models (under ~7B) often ignore parts of the coaching instructions.</pre></details>`;
  }
  return `<section class="card" style="padding:18px;gap:12px">
    <div class="row"><h3>AI tutor</h3><span class="spacer"></span>
      <div class="seg" role="group" aria-label="AI provider">
        <button data-act="aiprov" data-p="off" aria-pressed="${p === 'off'}">Off</button>
        <button data-act="aiprov" data-p="claude" aria-pressed="${p === 'claude'}">Claude</button>
        <button data-act="aiprov" data-p="ollama" aria-pressed="${p === 'ollama'}">Ollama</button>
      </div></div>
    ${body}
  </section>`;
}
function renderCoach() {
  if (!C.mode) {
    const p = provider();
    if (p === 'ollama' && OL.state === 'idle') setTimeout(ollamaCheck);
    $main.innerHTML = `<div class="wrap" style="gap:18px">
      <div><h2>Coach</h2><p style="color:var(--muted);max-width:62ch">Six ways to study with an AI tutor. Each one knows which lessons and words you've done. Tap any Chinese in a reply to hear it.</p></div>
      ${aiBarHtml()}
      <div class="modes">${MODES.map(m => {
        const sugg = typeof m.field.sugg === 'function' ? m.field.sugg() : m.field.sugg;
        return `<section class="mode">
          <h3>${m.title}</h3><p>${m.blurb}</p>
          <label class="eyebrow" for="f-${m.id}">${m.field.label}</label>
          ${m.field.area ? `<textarea class="field" id="f-${m.id}" rows="3" placeholder="${esc(m.field.ph)}"></textarea>` : `<input class="field" id="f-${m.id}" placeholder="${esc(m.field.ph)}">`}
          <div class="sugg">${sugg.map(s => `<button data-act="coachsugg" data-mode="${m.id}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
          ${m.extra ? `<label class="eyebrow" for="x-${m.id}">${m.extra.label}</label><input class="field" id="x-${m.id}" placeholder="${esc(m.extra.ph)}">` : ''}
          <span class="spacer"></span>
          <button class="btn primary" data-act="coachstart" data-mode="${m.id}">${noLive(p) ? 'Get the prompt' : 'Start session'}</button>
        </section>`;
      }).join('')}</div>
    </div>`;
    document.getElementById('ol-url')?.addEventListener('change', e => { AI.url = e.target.value; store.set('ai', AI); });
    document.getElementById('ol-model')?.addEventListener('change', e => { AI.model = e.target.value; store.set('ai', AI); });
    return;
  }
  const m = MODES.find(x => x.id === C.mode);
  const head = `<div class="row"><button class="btn ghost" data-act="coachback">← All coaches</button><span class="spacer"></span><h3>${m.title}</h3><span class="chip">${C.via === 'ollama' ? 'Ollama · ' + esc(AI.model || 'no model') : AI.tier === 'opus' ? 'Claude Opus' : 'Claude Fast'}</span></div>`;
  if (noLive(C.via)) { $main.innerHTML = `<div class="wrap" style="gap:18px">${head}${coachFallbackHtml()}</div>`; return; }
  const draft = document.getElementById('coach-in')?.value || '';
  const msgs = C.turns.slice(1).map(t => `<div class="msg ${t.role === 'user' ? 'me' : 'ai'}">${t.role === 'user' ? esc(t.content) : fmtAI(t.content)}</div>`).join('');
  $main.innerHTML = `<div class="wrap" style="gap:14px">${head}
    <details class="brief"><summary>What the coach was told</summary><pre>${esc(C.turns[0].content)}</pre></details>
    <div class="chat">${msgs}${C.busy ? `<div class="msg ai ${C.live ? '' : 'thinking'}" id="live">${C.live ? fmtAI(C.live) : 'Thinking…'}</div>` : ''}</div>
    ${C.err ? `<div class="row"><span class="err">${C.err}</span>${C.retry ? '<button class="btn" data-act="coachretry">Try again</button>' : ''}</div>` : ''}
    <div class="composer">
      <textarea class="field" id="coach-in" rows="2" placeholder="Type your answer (pinyin, 汉字 or English)" aria-label="Your message"></textarea>
      ${C.busy ? '<button class="btn" data-act="coachstop">Stop</button>' : '<button class="btn primary" data-act="coachsend">Send</button>'}
    </div>
  </div>`;
  const ta = document.getElementById('coach-in');
  ta.value = draft;
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.querySelector('[data-act="coachsend"]')?.click(); } });
  if (!C.busy) { ta.focus({ preventScroll: true }); document.querySelector('.chat .msg:last-child')?.scrollIntoView({ block: 'nearest' }); }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset;
  switch (d.act) {
    case 'tab': view = d.tab; if (view === 'review') R.all = false; try { history.replaceState(null, '', '#' + view); } catch {} render(); window.scrollTo(0, 0); break;
    case 'say': e.stopPropagation(); speak(d.text, !!d.slow); break;
    case 'start': startLesson(+d.unit); break;
    case 'quit': view = 'path'; L = null; render(); break;
    case 'begin': L.phase = 'learn'; L.i = 0; renderLesson(); speak(L.unit.words[0].h); break;
    case 'prev': if (L.i > 0) { L.i--; renderLesson(); } break;
    case 'next':
      if (L.i < L.unit.words.length - 1) { L.i++; renderLesson(); speak(L.unit.words[L.i].h); }
      else { L.qs = buildQuiz(L.unit); L.n = L.qs.length; L.qi = 0; L.phase = 'quiz'; renderLesson(); autoPlay(); }
      break;
    case 'answer': answer(+d.i); break;
    case 'continue': cont(); break;
    case 'tone': answerTone(+d.t); break;
    case 'tonenext': newToneItem(); render(); if (canListen()) setTimeout(() => speak(T.item[0]), 200); break;
    case 'reveal': R.shown = true; renderReview(); speak(BY_H[R.card].h); break;
    case 'grade': grade(+d.g); break;
    case 'dir': R.dir = d.dir; R.shown = false; renderReview(); break;
    case 'practiceall': R.all = true; nextReviewCard(); renderReview(); break;
    case 'stopall': R.all = false; R.card = null; renderReview(); break;
    case 'coachstart': coachStart(d.mode); break;
    case 'coachsugg': { const f = document.getElementById('f-' + d.mode); if (f) { f.value = d.v; f.focus(); } break; }
    case 'coachsend': { const ta = document.getElementById('coach-in'); const v = ta.value.trim(); if (v) { ta.value = ''; coachSend(v); } break; }
    case 'coachstop': C.ctl?.abort(); break;
    case 'aitier': AI.tier = d.t; store.set('ai', AI); renderCoach(); break;
    case 'aiprov': AI.provider = d.p; store.set('ai', AI); renderCoach(); if (d.p === 'ollama' && OL.state === 'idle') ollamaCheck(); break;
    case 'olconnect': AI.url = document.getElementById('ol-url').value; store.set('ai', AI); ollamaCheck(); break;
    case 'coachretry': coachRun(); break;
    case 'coachback': C.ctl?.abort(); C.mode = null; C.turns = []; C.err = ''; renderCoach(); break;
    case 'copyprompt': {
      const pre = document.getElementById('prompt-copy');
      const done = () => { b.textContent = 'Copied'; };
      const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected, press copy'; };
      try { navigator.clipboard.writeText(pre.textContent).then(done, sel); } catch { sel(); }
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (view === 'lesson' && L) {
    if (L.phase === 'quiz') {
      const q = L.qs[L.qi];
      if (q.picked == null && /^[1-4]$/.test(k) && q.opts[+k - 1] != null) { e.preventDefault(); answer(+k - 1); }
      else if (q.picked != null && k === 'Enter') { e.preventDefault(); cont(); }
    } else if (L.phase === 'learn' && (k === 'Enter' || k === 'ArrowRight')) { e.preventDefault(); document.querySelector('[data-act="next"]')?.click(); }
    else if (L.phase === 'learn' && k === 'ArrowLeft') { document.querySelector('[data-act="prev"]')?.click(); }
    else if (L.phase === 'intro' && k === 'Enter') { e.preventDefault(); document.querySelector('[data-act="begin"]')?.click(); }
  } else if (view === 'tones') {
    if (T.answered == null && /^[1-4]$/.test(k)) answerTone(+k);
    else if (T.answered != null && k === 'Enter') { e.preventDefault(); document.querySelector('[data-act="tonenext"]')?.click(); }
  } else if (view === 'review' && R.card) {
    if (!R.shown && (k === ' ' || k === 'Enter')) { e.preventDefault(); document.querySelector('[data-act="reveal"]')?.click(); }
    else if (R.shown && (k === '1' || k === '2')) grade(k === '2' ? 1 : 0);
  }
});

// ---------- boot ----------
if (hasTTS) { loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }
renderVoiceNote();
initCloud();
const h0 = (location.hash || '').slice(1);
if (['path', 'tones', 'review', 'coach', 'words'].includes(h0)) view = h0;
render();
</script>
